<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skatepark Builder 3D</title><link rel="stylesheet" href="./style.css"></head><body>
<div id="game"></div>
<div id="top" class="panel"><h1>🛹 SKATEPARK LAB</h1><div class="sub">Build your spot. Then skate it.</div></div>
<div id="tools" class="panel"><div class="label">MODE</div><div class="grid"><button id="buildBtn" class="active">✚ BUILD</button><button id="playBtn">▶ SKATE</button></div><hr><div class="label">PARK PIECES</div><div class="grid"><button data-piece="ramp" class="active">◢ Ramp</button><button data-piece="quarter">⌒ Quarter pipe</button><button data-piece="rail">━ Rail</button><button data-piece="wall">▰ Wall</button><button data-piece="box">▰ Grind box</button><button data-piece="stairs">▥ Stairs</button></div><div class="row"><button id="rotateBtn">↻ Rotate (R)</button><button id="deleteBtn">✕ Delete</button></div><div class="row"><button id="clearBtn">Clear park</button><button id="resetBtn">Reset skater</button></div><div class="sub" style="margin-top:9px">Click the ground to place a piece. R rotates it. Click a piece to select it.</div></div>
<div id="status" class="panel"><span>SESSION</span><strong id="modeText">BUILD MODE</strong><span id="scoreText">0 points</span></div>
<div id="bottom" class="panel"><span class="hint"><b class="key">W</b><b class="key">S</b> Move</span><span class="hint"><b class="key">A</b><b class="key">D</b> Turn</span><span class="hint"><b class="key">SPACE</b> Ollie</span><span class="hint"><b class="key">Q</b> Kickflip</span><span class="hint"><b class="key">R</b> Rotate piece</span></div><div id="crosshair"></div><div id="toast"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script><script type="module" src="./js/game.js"></script></body></html>
